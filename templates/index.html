<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | Cyber Aggression Detection</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">


    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>




</head>


<body class="chat-page">


    <!-- =====================================================
         NOTIFICATIONS
    ====================================================== -->

    <div id="notificationBox"></div>


    <!-- =====================================================
         CHAT WRAPPER
    ====================================================== -->

    <div class="chat-wrapper">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="chat-header">


            <a href="javascript:history.back()" class="back-btn">

                <span class="back-arrow">
                    ←
                </span>

                Back

            </a>


            <span id="chatUser">

                Connecting...

            </span>


            <a href="{{ url_for('logout') }}">

                Logout

            </a>


        </div>


        <!-- =================================================
             CHAT AREA
        ================================================== -->

        <div id="chatBox" class="chat-box">

        </div>


        <!-- =================================================
             MESSAGE INPUT
        ================================================== -->

        <div class="input-area">


            <input id="messageInput" placeholder="Type a message..." autocomplete="off">


            <button onclick="sendMessage()">

                Send

            </button>


        </div>


    </div>


    <!-- =====================================================
         CHAT VARIABLES
    ====================================================== -->

    <script>

        let username =
            "{{ session['user'] }}";


        let receiver =
            "{{ receiver }}";


    </script>


    <!-- =====================================================
         CHAT HISTORY + NEW MESSAGE DIVIDER
    ====================================================== -->

    <script>


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /*
                 * Show receiver name.
                 */

                document.getElementById(
                    "chatUser"
                ).innerText =
                    "Chat with " + receiver;


                /*
                 * ENTER KEY
                 */

                document.getElementById(
                    "messageInput"
                ).addEventListener(
                    "keydown",
                    function (event) {


                        if (
                            event.key === "Enter"
                        ) {

                            event.preventDefault();

                            sendMessage();

                        }

                    }
                );


                /*
                 * Load saved messages.
                 */

                loadChatHistory();

            }
        );


        /* =================================================
           LOAD CHAT HISTORY
        ================================================== */

        function loadChatHistory() {

            fetch(
                "/get_messages?receiver=" +
                encodeURIComponent(receiver)
            )

                .then(function (response) {

                    if (!response.ok) {
                        throw new Error(
                            "Failed to load messages."
                        );
                    }

                    return response.json();

                })

                .then(function (data) {

                    const chatBox =
                        document.getElementById("chatBox");

                    chatBox.innerHTML = "";

                    /*
                     * Render the saved conversation normally.
                     * No New Messages divider is created.
                     */
                    (data.messages || []).forEach(
                        function (msg) {

                            const messageElement =
                                document.createElement("div");

                            if (msg.sender === username) {

                                messageElement.className =
                                    "message sent";

                            } else {

                                messageElement.className =
                                    "message received";

                            }

                            messageElement.textContent =
                                msg.message;

                            chatBox.appendChild(
                                messageElement
                            );

                        }
                    );

                    /*
                     * Keep the existing unread-count/read-status
                     * system working, but do not display a divider.
                     */
                    if (
                        (data.unread_message_ids || []).length > 0
                    ) {

                        markCurrentChatAsRead();

                    }

                    /*
                     * Open the conversation at the latest message.
                     */
                    chatBox.scrollTop =
                        chatBox.scrollHeight;

                })

                .catch(function (error) {

                    console.error(
                        "Chat history error:",
                        error
                    );

                });

        }


        /* =================================================
           MARK CHAT AS READ
        ================================================== */

        function markCurrentChatAsRead() {

            fetch(
                "/mark_messages_read",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        "friend=" +
                        encodeURIComponent(receiver)

                }
            )

                .catch(function (error) {

                    console.error(
                        "Read status error:",
                        error
                    );

                });

        }


        /*
         * Load saved messages when the page is ready.
         */
        loadChatHistory();

    </script>


    <!-- =====================================================
         EXISTING SOCKET.IO SCRIPT
    ====================================================== -->

    <script src="{{ url_for('static', filename='script.js') }}">
    </script>


</body>

</html>
